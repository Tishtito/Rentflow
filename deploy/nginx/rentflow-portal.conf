# rentflow.codepasstech.top: the tenant portal, a static React build (frontend/apps/portal/dist,
# uploaded by frontend/deploy/deploy.sh). Its API calls go to /api/ and /sanctum/ on this same host and are handed
# to Laravel here, so the login cookie is first-party and no CORS is involved.
#
# This block listens on port 80 only. `certbot --nginx` adds the HTTPS (443) part and the http → https
# redirect to it (see README.md).
server {
    listen 80;
    listen [::]:80;
    server_name rentflow.codepasstech.top;

    root /home/tito/rentflow/frontend/apps/portal/dist;
    index index.html;

    include snippets/rentflow-common.conf;
    add_header X-Frame-Options "DENY" always;

    access_log /var/log/nginx/rentflow-portal.access.log;
    error_log  /var/log/nginx/rentflow-portal.error.log;

    # API: same Laravel app as api.rentflow.codepasstech.top.
    location ^~ /api/ {
        include snippets/rentflow-php.conf;
    }
    location ^~ /sanctum/ {
        include snippets/rentflow-php.conf;
    }

    # Hashed build files never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The service worker, its registration and the app shell must always be fresh so updates arrive.
    location ~* ^/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Single-page app: every other path is a React route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
